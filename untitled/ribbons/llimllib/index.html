<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>squiggles</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      font: 11px/1.6 -apple-system, sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, .35);
      padding: 8px 10px;
      border-radius: 4px;
      opacity: .25;
      transition: opacity .2s;
      display: grid;
      grid-template-columns: auto 110px auto;
      gap: 2px 8px;
      align-items: center;
    }

    #controls:hover {
      opacity: .95;
    }

    #controls input[type=range] {
      width: 110px;
    }

    #controls .val {
      font-variant-numeric: tabular-nums;
      opacity: .7;
    }

    #controls button {
      grid-column: 1 / -1;
      margin-top: 4px;
      font: inherit;
      color: #fff;
      background: rgba(255, 255, 255, .15);
      border: 0;
      border-radius: 3px;
      padding: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div id="controls"></div>
  <script>
    // sampled from squiggles.png; repeats weight the draw by how much of the
    // original each color covers
    const PALETTE = [
      "#aa4439", "#aa4439", "#aa4439", "#8a3f38",
      "#bba436", "#bba436", "#bba436", "#a38742",
      "#2e778a", "#2e778a", "#2b6273", "#567986",
      "#1a181b", "#1a181b", "#232022",
      "#e4e5e2", "#e4e5e2", "#bdc5c4",
      "#7c8273", "#595e5c", "#3d4446",
    ].map((hex) => {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    });

    const PARAMS = [
      {id: "lines", label: "lines", min: 1, max: 120, step: 1, value: 55},
      {id: "width", label: "width", min: .2, max: 5, step: .05, value: 2},
      {id: "brush", label: "brush", min: 0, max: 1, step: .01, value: .3},
      {id: "squiggle", label: "squiggle", min: 0, max: 1, step: .01, value: .45},
      {id: "waves", label: "waves", min: .2, max: 5, step: .05, value: 1.3},
      {id: "roughness", label: "roughness", min: 0, max: 1, step: .01, value: .08},
      {id: "saturation", label: "saturation", min: 0, max: 2, step: .02, value: 1},
      {id: "wash", label: "wash", min: 0, max: 1, step: .01, value: .2},
      {id: "deviation", label: "deviation", min: 0, max: 1, step: .01, value: .38},
    ];

    const state = {};
    const controls = document.getElementById("controls");
    for (const p of PARAMS) {
      state[p.id] = p.value;
      const label = document.createElement("label");
      label.textContent = p.label;
      const input = document.createElement("input");
      Object.assign(input, {type: "range", min: p.min, max: p.max, step: p.step, value: p.value});
      const val = document.createElement("span");
      val.className = "val";
      val.textContent = p.value;
      input.addEventListener("input", () => {
        state[p.id] = +input.value;
        val.textContent = input.value;
        draw();
      });
      controls.append(label, input, val);
    }
    const reseed = document.createElement("button");
    reseed.textContent = "reseed";
    reseed.addEventListener("click", () => {seed = (Math.random() * 1e9) | 0; draw();});
    controls.append(reseed);

    let seed = (Math.random() * 1e9) | 0;

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const HARMONICS = 4;
    // strokes run past both edges so no blunt end is ever visible on the canvas
    const OVERHANG = .08;

    // A squiggle is a sum of sines; at deviation 0 every line shares one shape.
    function makeWave(rand, waves) {
      const parts = [];
      for (let k = 0; k < HARMONICS; k++) {
        parts.push({
          amp: (1 / Math.pow(k + 1, 2.2)) * (.6 + rand() * .8),
          freq: (k + 1) * waves * (.85 + rand() * .3),
          phase: rand() * Math.PI * 2,
        });
      }
      return parts;
    }

    function mixWaves(base, own, t) {
      return base.map((b, i) => ({
        amp: b.amp + (own[i].amp - b.amp) * t,
        freq: b.freq + (own[i].freq - b.freq) * t,
        phase: b.phase + (own[i].phase - b.phase) * t,
      }));
    }

    function waveAt(parts, u) {
      let y = 0;
      for (const p of parts) y += p.amp * Math.sin(p.freq * u * Math.PI * 2 + p.phase);
      return y;
    }

    let lastColor = -1;
    function pickColor(rand, saturation) {
      let c = (rand() * PALETTE.length) | 0;
      if (c === lastColor) c = (c + 1 + ((rand() * (PALETTE.length - 1)) | 0)) % PALETTE.length;
      lastColor = c;
      return saturate(PALETTE[c], saturation);
    }

    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth, h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#efece5";
      ctx.fillRect(0, 0, w, h);

      const rand = mulberry32(seed);
      const {lines, width, brush, squiggle, waves, roughness, saturation, wash, deviation} = state;
      const baseWave = makeWave(rand, waves);
      const amplitude = squiggle * h * 0.16;
      const steps = Math.max(60, Math.round(w / 4));

      // ribbons are packed into slots of varying height, so a thin ribbon leaves a
      // narrow slot rather than a hole
      const slots = [];
      let total = 0;
      for (let i = 0; i < lines; i++) {
        const s = .35 + Math.pow(rand(), 2) * 1.5;
        slots.push(s);
        total += s;
      }
      const unit = (h + amplitude) / total;

      let cursor = -amplitude / 2;
      for (let i = 0; i < lines; i++) {
        const slot = slots[i] * unit;
        const wave = mixWaves(baseWave, makeWave(rand, waves), deviation);
        const y0 = cursor + slot / 2;
        cursor += slot;
        const color = pickColor(rand, saturation);
        const half = slot * width * .5;
        const drift = (rand() - .5) * amplitude * deviation;
        // mirroring reverses a line's entry direction outright; a minority get it so
        // the field isn't uniformly rising at the left edge
        const polarity = rand() < deviation * .7 ? -1 : 1;
        const shift = (rand() - .5) * deviation * .3 / waves;
        // a thinned-out stroke lets whatever it crosses show through
        const alpha = rand() < wash * .6 ? .3 + rand() * .45 : 1;

        const pts = [];
        for (let s = 0; s <= steps; s++) {
          const u = OVERHANG * -1 + (s / steps) * (1 + OVERHANG * 2);
          const x = u * w;
          const y = y0 + polarity * waveAt(wave, u + shift) * amplitude + drift * Math.sin(u * Math.PI);
          pts.push({x, y});
        }
        addNormals(pts);
        paint(pts, color, half, brush, roughness, alpha, rand);
      }
    }

    function addNormals(pts) {
      for (let i = 0; i < pts.length; i++) {
        const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        pts[i].nx = -dy / len;
        pts[i].ny = dx / len;
      }
    }

    function shade(rgb, amount) {
      const ch = rgb.map((v) =>
        Math.max(0, Math.min(255, Math.round(amount > 0 ? v + (255 - v) * amount : v * (1 + amount))))
      );
      return `rgb(${ch[0]},${ch[1]},${ch[2]})`;
    }

    function saturate(rgb, amount) {
      const lum = rgb[0] * .3 + rgb[1] * .59 + rgb[2] * .11;
      return rgb.map((v) => Math.max(0, Math.min(255, Math.round(lum + (v - lum) * amount))));
    }

    // The body is a filled ribbon along the curve's normals; brushiness ruffles
    // its edges and lays streaks of bristle drag over the top, some breaking into
    // dry-brush gaps.
    function paint(pts, color, half, brush, roughness, alpha, rand) {
      const jig = rand() * 100;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
      ribbon(pts, (i) => half * edgeNoise(i, jig, roughness, 1), (i) => -half * edgeNoise(i, jig + 99, roughness, -1));
      ctx.fill();

      if (brush === 0) return;

      const streaks = Math.round(3 + brush * 14);
      for (let s = 0; s < streaks; s++) {
        const center = (rand() * 2 - 1) * half * .95;
        const thick = half * (.03 + rand() * .18);
        const light = rand() < .45;
        ctx.fillStyle = shade(color, light ? .35 + rand() * .4 : -(.2 + rand() * .35));
        ctx.globalAlpha = (.08 + rand() * .35) * brush * alpha;

        // dry-brush: a streak only covers part of the stroke's length
        const from = Math.floor(rand() * pts.length * .8);
        const to = Math.min(pts.length - 1, from + Math.round(pts.length * (.15 + rand() * .85)));
        const span = pts.slice(from, to + 1);
        if (span.length < 3) continue;
        const wob = brush * half * .12;
        const phase = rand() * 10;
        ribbon(
          span,
          (i) => center + thick + Math.sin(i * .17 + phase) * wob,
          (i) => center - thick + Math.sin(i * .17 + phase) * wob
        );
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function edgeNoise(i, jig, roughness, side) {
      return 1 + roughness * .35 * side * Math.sin(i * .41 + jig) * Math.sin(i * .13 + jig * 1.7);
    }

    // offsets are signed distances along each point's normal
    function ribbon(pts, upper, lower) {
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i], d = upper(i);
        const x = p.x + p.nx * d, y = p.y + p.ny * d;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i], d = lower(i);
        ctx.lineTo(p.x + p.nx * d, p.y + p.ny * d);
      }
      ctx.closePath();
    }

    window.addEventListener("resize", draw);
    draw();
  </script>
</body>

</html>
